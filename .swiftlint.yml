# SwiftLint configuration for Yemma4.
#
# This is intentionally lenient: it is meant to surface real problems for CI
# and developers without forcing a large mechanical cleanup across the existing
# ~14.5k-line codebase. SwiftLint is NOT a build dependency — run it manually
# (see README) or wire it into CI as desired.
#
# Run locally with:
#   swiftlint lint --config .swiftlint.yml --quiet

# Directories that contain no first-party source we want to lint.
excluded:
  - .build
  - .swiftpm
  - DerivedData
  - Dependencies
  - Tests/Yemma4Tests/Fixtures
  - Yemma4/ThirdParty
  - website
  - scripts
  - ci_scripts

# Opt-in rules that are useful but not enabled by default.
opt_in_rules:
  - force_unwrapping
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - last_where
  - sorted_first_last
  - redundant_nil_coalescing
  - closure_spacing
  - operator_usage_whitespace
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

# Rules from the default set that are too noisy for this codebase right now.
disabled_rules:
  - todo
  - trailing_comma
  - multiple_closures_with_trailing_closure

# Keep severities friendly: surface issues as warnings, not hard errors, so a
# lint run never blocks people who just want feedback.
force_unwrapping:
  severity: warning

force_cast:
  severity: warning

force_try:
  severity: warning

line_length:
  warning: 160
  error: 240
  ignores_urls: true
  ignores_comments: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

type_body_length:
  warning: 500
  error: 800

file_length:
  warning: 1200
  error: 2000
  ignore_comment_only_lines: true

function_body_length:
  warning: 120
  error: 200

function_parameter_count:
  warning: 8
  error: 10

cyclomatic_complexity:
  warning: 20
  error: 30

large_tuple:
  warning: 3
  error: 4

nesting:
  type_level:
    warning: 3

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  # Common short, conventional names that should not be flagged.
  allowed_symbols: ["_"]
  excluded:
    - id
    - x
    - y
    - z
    - r
    - g
    - b
    - a
    - dx
    - dy
    - to
    - up
    - vm

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

reporter: "xcode"
